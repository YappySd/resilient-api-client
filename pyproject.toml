[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-api-client"
version = "0.1.0"
description = "Async HTTP client with rate limiting, retries, exponential backoff and Retry-After support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["resilient_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
